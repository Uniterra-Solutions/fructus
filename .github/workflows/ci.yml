# Fructus CI.
#
# The suites are split as far as the tooling allows so that one red X points at
# one module/suite and the slow suites (bank CPI, validator e2e, server suites,
# Trident fuzz) run on separate runners in parallel:
#
#   gates      fmt · clippy
#   rust lib   one job per module of the `fructus` lib binary (7) + review suites
#   sbf        one job builds the `.so` the bank/e2e/server/fuzz jobs load
#   cpi        positions scenarios · positions property tests · collateral vault ·
#              operator delegation
#   ts         publisher · sdk · cli · scripts (offline e2e dry run)
#   server     product-v2 backend: typecheck + node:test suites (validator harness)
#   e2e        integration: solana-test-validator + SDK against the real program
#   fuzz       trident: fuzz_0 (oracle, gating) + market (non-blocking, aborts today)
#
# The module jobs select by test-name prefix (`^funding::`), so a new module gets
# its own job by adding one matrix entry. The full local equivalent of this file
# is `cargo nextest run --workspace` (docs/testing.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never reuses incremental state; it only bloats the cache.
  CARGO_INCREMENTAL: "0"
  # Agave toolchain: `cargo build-sbf` (the `.so` every bank/e2e/fuzz job loads)
  # and `solana-test-validator` (the integration suite). Bump together with
  # docs/setup.md.
  SOLANA_VERSION: "4.2.0"

jobs:
  # ---------------------------------------------------------------- gates ----
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned to the toolchain docs/setup.md was validated against (the package
      # MSRV is lower); bump it in one place per job when the toolchain moves.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ------------------------------------------------------------- rust lib ----
  # One job per module of the `fructus` lib binary. Instant locally, but the split
  # is what makes CI failures legible (and keeps the pure-logic suites off the
  # bank runners).
  lib:
    name: rust · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: invariants (tests.rs)
            filter: 'binary(fructus) and test(/^tests::/)'
          - name: handlers (lib.rs adapters)
            filter: 'binary(fructus) and test(/^handlers_tests::/)'
          - name: positions
            filter: 'binary(fructus) and test(/^positions::/)'
          - name: liquidation
            filter: 'binary(fructus) and test(/^liquidation::/)'
          - name: funding
            filter: 'binary(fructus) and test(/^funding::/)'
          - name: settlement (Design A pool)
            # The no-mint invariants: pool ≥ 0, Σ deposited ≤ vault, pending claims.
            filter: 'binary(fructus) and test(/^settlement::/)'
          - name: state · order book · collateral
            # `test_id` (top-level, no module) is generated by Anchor's
            # `declare_id!`: it asserts the program id matches Anchor.toml.
            filter: 'binary(fructus) and (test(/^(state|orderbook|collateral)::/) or test(=test_id))'
          - name: review suites
            filter: 'binary(review_liquidation_conservation) + binary(review_liquidation_invariants)'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1
      # cargo-nextest is not on the runner image; the prebuilt binary makes this a
      # few seconds. rust-cache restores ~/.cargo/bin, so later runs skip it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -E '${{ matrix.filter }}'

  # --------------------------------------------------------- SBF artifact ----
  sbf:
    name: sbf · build .so
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install the Agave CLI (cargo-build-sbf)
        run: |
          curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1
      - uses: actions/cache@v6
        with:
          # Platform-tools + the SBF rustc `cargo-build-sbf` drives through rustup.
          # Keyed on the pinned tools version: a miss only costs the download.
          path: |
            ~/.cache/solana
            ~/.rustup/toolchains/*sbpf*
          key: solana-tools-${{ runner.os }}-${{ env.SOLANA_VERSION }}-v1.52
      # One build serves all three consumers, but two paths: the bank suites and
      # the validator e2e load `target/deploy/fructus.so`, while the fuzz harness
      # reads `target/deploy-v0/fructus.so` (Trident.toml) because its TridentSVM
      # (agave 2.3.x) executes SBPFv0 only.
      #
      # `--tools-version` is pinned: the newer default (v1.54 at the time of
      # writing) emits a binary that both the solana-program-test bank and
      # TridentSVM fail on at run time ("Access violation in unknown section" out
      # of `initialize_market`), which reads like a protocol bug. Verified locally:
      # v1.52 + `--arch v0` → 543,760 B, bank green, fuzz_0 laps 1000 x 100 flows;
      # v1.54 (same `--arch v0`) → 506,464 B, traps. `--arch v0` is explicit —
      # devnet deployments need SBPFv3 (SIMD-0500), which `scripts/deploy.sh`
      # builds separately.
      - name: Build the program
        run: |
          cargo build-sbf --manifest-path programs/fructus/Cargo.toml \
            --tools-version v1.52 --arch v0 --sbf-out-dir target/deploy-v0
          mkdir -p target/deploy
          cp target/deploy-v0/fructus.so target/deploy/fructus.so
      - uses: actions/upload-artifact@v7
        with:
          name: fructus-so
          path: target/deploy/fructus.so
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: fructus-so-v0
          path: target/deploy-v0/fructus.so
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------- bank suites ----
  # These load `target/deploy/fructus.so` and drive it inside a
  # solana-program-test bank. The `.so` is downloaded (its mtime is refreshed so
  # the `cpi_binary_is_present_and_fresh` guard compares it against the sources,
  # not against the artifact's timestamp).
  cpi:
    name: cpi · ${{ matrix.name }}
    needs: sbf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: positions scenarios (12 bank txs)
            filter: 'binary(positions_cpi) and not test(~pbt_)'
          - name: positions property tests (2 × 20 bank cases)
            filter: 'binary(positions_cpi) and test(~pbt_)'
          - name: collateral vault
            filter: 'binary(collateral_cpi)'
          - name: operator delegation
            filter: 'binary(operator_cpi)'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-1.97.1
      - uses: actions/download-artifact@v8
        with:
          name: fructus-so
          path: target/deploy
      - name: Refresh the .so mtime for the freshness guard
        run: touch target/deploy/fructus.so
      # cargo-nextest is not on the runner image; the prebuilt binary makes this a
      # few seconds. rust-cache restores ~/.cargo/bin, so later runs skip it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -E '${{ matrix.filter }}'

  # ------------------------------------------------------------- TS suites ----
  ts:
    name: ts · ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [publisher, sdk, cli, scripts]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      # `cli` and `scripts` import the SDK's sources (`fructus-sdk/src/index.js`), and
      # resolution walks up from the *importing file*: `sdk/src/*.ts` resolves
      # `@solana/web3.js` and `@solana/kit` from `sdk/node_modules` — never from the
      # dependent package's. Without this step the dependent package type-checks the
      # SDK sources with TS2307 on every `sdk/src/*.ts` file (reproduced locally by
      # moving `sdk/node_modules` aside).
      - name: Install the SDK
        if: matrix.package == 'cli' || matrix.package == 'scripts'
        working-directory: sdk
        run: npm ci
      - name: Install
        working-directory: ${{ matrix.package }}
        run: npm ci
      - name: Type-check
        # `publisher` used to be skipped here: `src/update.ts` called `Keypair.sign`,
        # which @solana/web3.js >= 1.98 no longer exposes — not in its types and not at
        # run time (`TypeError: publisher.sign is not a function`). `buildUpdateTx` now
        # signs through `Ed25519Program.createInstructionWithPrivateKey` and is pinned
        # by `publisher/test/update.test.ts` (valid-signature check), so the whole
        # matrix type-checks and builds again.
        working-directory: ${{ matrix.package }}
        run: |
          npm run typecheck --if-present
          npm run build --if-present
      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test --if-present
      # `scripts/` tests are the frozen MM/devstack suites (run by `npm test`
      # above); the offline e2e dry run stays as the package's smoke check
      # (no RPC, no keypair — the network walk is gated behind RUN_E2E).
      - name: Offline e2e dry run
        if: matrix.package == 'scripts'
        working-directory: ${{ matrix.package }}
        run: npm run e2e

  # ----------------------------------------------------------- server (v2) ----
  # Product-v2 backend (REQ-B-10). Every test file spawns its own hermetic
  # `solana-test-validator` (staged `.so` + synthetic stake pool) and drives the
  # real server process, so the job needs the same Agave CLI provisioning as
  # `integration` plus the SBF artifact. The files run SEQUENTIALLY — parallel
  # `node:test` file execution is a known flake here, so keep `--test-concurrency=1`.
  server:
    name: server · product-v2 backend
    needs: sbf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            sdk/package-lock.json
      - name: Install the Agave CLI (solana-test-validator)
        run: |
          curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: fructus-so
          path: target/deploy
      # `server` imports the SDK's sources (`fructus-sdk/src/*.js`); resolution
      # walks up from the importing file, so `@solana/web3.js` must exist in
      # `sdk/node_modules` (same reason as the `cli` / `scripts` entries).
      - name: Install the SDK
        working-directory: sdk
        run: npm ci
      - name: Install
        working-directory: server
        run: npm ci
      - name: Type-check
        working-directory: server
        run: npm run typecheck
      - name: Test
        working-directory: server
        # One file at a time: the suites flake when the runner parallelizes them.
        run: npx tsx --test --test-force-exit --test-concurrency=1 test/*.test.ts

  # -------------------------------------------------------- frontend (v3) -----
  # Product-v3 trading terminal: vitest (jsdom) suites + typecheck + the vite
  # build. The package imports the SDK's sources — install the sdk deps first
  # (same resolution rationale as the `server` job).
  frontend:
    name: frontend · trading terminal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/package-lock.json
      - name: Install the SDK
        working-directory: sdk
        run: npm ci
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  # ------------------------------------------------------------- e2e (SVM) ----
  integration:
    name: e2e · solana-test-validator
    needs: sbf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            integration/package-lock.json
            sdk/package-lock.json
            cli/package-lock.json
      - name: Install the Agave CLI (solana-test-validator)
        run: |
          curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: fructus-so
          path: target/deploy
      # `integration` imports both the SDK's and the CLI's sources.
      - name: Install the SDK
        working-directory: sdk
        run: npm ci
      - name: Install the CLI
        working-directory: cli
        run: npm ci
      - name: Install
        working-directory: integration
        run: npm ci
      - name: Run (spawns its own validator + ledger)
        working-directory: integration
        run: npm test

  # ----------------------------------------------------------------- fuzz ----
  fuzz:
    name: fuzz · ${{ matrix.target }}
    needs: sbf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: oracle
            bin: fuzz_0
            experimental: false
          # `market` aborts at start-up with a host stack overflow before it runs a
          # single iteration (`thread '<unknown>' has overflowed its stack`, exit
          # 134). It is not a stack-size problem — a 1 GiB `RUST_MIN_STACK` does not
          # move it, and the harness's own 64 MiB wrapper thread is not the one that
          # dies — nor an artifact problem: it still aborts on trident 0.13.0-rc.4
          # with the SBPFv0 build (`fuzz_0` laps 1000 x 100 flows on the same file).
          # Kept in the matrix as a non-blocking job so the failure stays visible
          # until it is fixed; drop `experimental` to make it a gate again.
          - target: market
            bin: market
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          # trident-tests is its own workspace, so it gets its own cache.
          shared-key: rust-1.97.1-trident
          workspaces: trident-tests
      # Trident.toml points at target/deploy-v0 (TridentSVM executes SBPFv0 only).
      - uses: actions/download-artifact@v8
        with:
          name: fructus-so-v0
          path: target/deploy-v0
      - name: Fuzz ${{ matrix.target }}
        working-directory: trident-tests
        run: cargo run --bin ${{ matrix.bin }}
      - name: Upload Trident metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trident-metrics-${{ matrix.target }}
          path: |
            trident-tests/fuzz_0/metrics
            trident-tests/market/metrics
          if-no-files-found: ignore
          retention-days: 7
