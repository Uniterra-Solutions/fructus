# Fructus — local devstack trading terminal (validator + backend on 127.0.0.1)
# Tailnet-only: 100.64.0.1 listeners (80 -> 301, 443 -> HTTPS).
# Static: /var/www/fructus (frontend/dist). Proxies mirror frontend/vite.config.ts:
#   /api -> 127.0.0.1:8787 (prefix stripped) · /ws -> :8787 (push socket)
#   /rpc -> 127.0.0.1:8899 (solana-test-validator)

server {
    listen 100.64.0.1:80;
    server_name fructus.uniterra-solutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 100.64.0.1:443 ssl;
    server_name fructus.uniterra-solutions.com;

    ssl_certificate /etc/letsencrypt/live/uniterra-solutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uniterra-solutions.com/privkey.pem;

    client_max_body_size 10m;

    root /var/www/fructus;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /rpc {
        proxy_pass http://127.0.0.1:8899/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
